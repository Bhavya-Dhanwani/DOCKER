name: release
# Builds the installers for Windows (x64, arm64), Linux (x64, arm64) and macOS (Intel, Apple silicon).
# Run it by hand (Actions -> release -> Run workflow) or push a tag like v0.1.0 to also publish a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
          rustup target add ${{ matrix.target }}
      - name: engine (static, runs in the Windows and macOS VMs too)
        run: cargo build --release -p docker-cli --target ${{ matrix.target }}
      - name: native app
        run: cargo build --release -p docker-cli -p docker-gui
      - name: package
        run: |
          d=sasta-docker-linux-${{ matrix.arch }}
          mkdir -p dist/$d
          cp target/release/docker target/release/docker-gui dist/$d/
          cp target/${{ matrix.target }}/release/docker dist/docker-linux-${{ matrix.arch }}
          cp installer/install.sh installer/sasta-docker.desktop LICENSE README.md dist/$d/
          chmod +x dist/$d/install.sh
          tar -C dist -czf dist/$d.tar.gz $d
          rm -rf dist/$d
      - uses: actions/upload-artifact@v4
        with: { name: linux-${{ matrix.arch }}, path: dist/* }

  windows:
    needs: linux
    strategy:
      matrix:
        include:
          - { runner: windows-2025, arch: x64, engine: x86_64 }
          - { runner: windows-11-arm, arch: arm64, engine: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-${{ matrix.engine }}, path: engine }
      - run: cargo build --release -p docker-cli -p docker-gui
      - name: installer
        shell: pwsh
        run: |
          Copy-Item engine\docker-linux-${{ matrix.engine }} target\release\
          $v = "${{ github.ref_name }}".TrimStart('v'); if (-not $v -or $v -notmatch '^\d') { $v = '0.1.0' }
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=${{ matrix.arch }} /DVersion=$v /DBin=..\target\release installer\sasta-docker.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows-${{ matrix.arch }}, path: dist/*.exe }

  macos:
    needs: linux
    strategy:
      matrix:
        include:
          - { runner: macos-13, arch: x86_64 }
          - { runner: macos-14, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-${{ matrix.arch }}, path: engine }
      - run: cargo build --release -p docker-cli -p docker-gui
      - name: package
        run: |
          # the macOS command runs Linux containers in a Lima VM; the engine for that VM is installed next to it
          root=pkgroot/usr/local/bin
          mkdir -p $root dist
          cp target/release/docker target/release/docker-gui $root/
          cp engine/docker-linux-${{ matrix.arch }} $root/
          pkgbuild --root pkgroot --identifier dev.sasta.docker --version 0.1.0 --install-location / dist/SastaDocker-macos-${{ matrix.arch }}.pkg
      - uses: actions/upload-artifact@v4
        with: { name: macos-${{ matrix.arch }}, path: dist/*.pkg }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: gh release create ${{ github.ref_name }} out/*.tar.gz out/*.exe out/*.pkg --generate-notes --repo ${{ github.repository }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
