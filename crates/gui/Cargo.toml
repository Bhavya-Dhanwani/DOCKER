[package]
name = "docker-gui"
description = "Native dashboard for running containers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# on Linux the window needs a display backend (macOS and Windows have theirs built in)
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
