[package]
name = "docker-core"
description = "Tiny, RAM- and SSD-frugal container runtime (Linux namespaces/cgroups, Windows Job Objects)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
docker-image = { path = "../image" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints]
workspace = true
