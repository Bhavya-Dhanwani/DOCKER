[package]
name = "docker-image"
description = "OCI image reference parsing, registry pull, and a deduplicating layer store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
# pure-Rust zstd decoder for application/vnd.oci.image.layer.v1.tar+zstd layers
ruzstd = "0.8"
tar = "0.4"
bzip2-rs = "0.1.2"
lzma-rs = "0.3.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
